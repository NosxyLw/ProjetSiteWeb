<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Votre Commande — Travel Rycks Time</title>
    <link rel="icon" href="../images/LogoRycks.png" type="image/png">
    <link rel="stylesheet" href="../css/css.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="Page1.html" class="site-logo" aria-label="Accueil">
            <img src="../images/LogoNaviguation.png" alt="Travel Rycks Time">
        </a>
        <nav class="main-nav">
            <a href="Page1.html">Accueil</a>
            <a href="Page2.html">Réservations</a>
            <a href="Page3.html">A propos de nous</a>
            <a href="experiences.html">Expériences clients</a>
            <a href="offres.html">Nos offres spéciales</a>
        </nav>
    </header>

    <main id="main" class="destinations-page">
        <section class="order-section content-section">
            <h2>Votre Commande</h2>
            <div class="title-accent"></div>

            <form class="order-form" id="orderForm" style="max-width:800px;margin:18px auto;">
                <div class="order-field" data-order="1">
                    <label for="name">Nom complet</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="order-field" data-order="2">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="order-field" data-order="3">
                    <label for="phone">Téléphone</label>
                    <input id="phone" name="phone" type="tel">
                </div>

                <div class="order-field" data-order="4">
                    <label for="destination">Destination souhaitée</label>
                    <input id="destination" name="destination" type="text" required>
                </div>

                <div class="order-field" data-order="5">
                    <label for="date">Date souhaitée</label>
                    <input id="date" name="date" type="date">
                </div>

                <div class="order-field" data-order="6">
                    <label for="notes">Informations complémentaires</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <div class="order-field" data-order="7" style="text-align:center;">
                    <button type="submit" class="btn-order">Envoyer la commande</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-left">
                <p class="footer-names">Ahmed Ziat<br>Jordan Bongo Luemba<br>Dylan Sundari</p>
            </div>
            <div class="footer-center">
                <a class="footer-report-link" href="rapport.html">Rapport du projet</a>
            </div>
            <div class="footer-right">
                <img class="footer-iut" src="../images/Logo IUT.jpg" alt="Logo IUT">
            </div>
        </div>
        <div class="footer-bottom"><p>&copy; 2025 Travel Rycks Time - Tous droits réservés</p></div>
    </footer>

    <script>
    (function(){
        // Staggered appearance for order fields
        const fields = Array.from(document.querySelectorAll('.order-field'));
        function revealFields(){
            fields.forEach(function(f, i){
                setTimeout(function(){ f.classList.add('visible'); }, i * 220);
            });
        }

        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', revealFields);
        } else {
            revealFields();
        }

        // simple submit handler (placeholder)
        const form = document.getElementById('orderForm');
        form.addEventListener('submit', function(e){
            e.preventDefault();
            alert('Merci — votre commande a été envoyée (exemple).');
            form.reset();
        });
    })();
    </script>
</body>
</html>
